[package]
name = "bklog"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
libc = "0.2.191"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zstd = "0.14.3"

[[bin]]
name = "bklog"
path = "src/bin/bklog.rs"

[[bin]]
name = "bkcat"
path = "src/bin/bkcat.rs"

[profile.release]
opt-level = 3
lto = "thin"
